# Test database: H2 in-memory
spring.datasource.url=jdbc:h2:mem:moneyos_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=MONTH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT test configuration
moneyos.jwt.secret=VGhpc0lzQU5vdFJlYWxTZWN1cmVLZXlGb3JNb25leU9TVGVzdGluZzEyMzQ1Njc4OTA=
moneyos.jwt.expiration-ms=900000

# Google OAuth test configuration
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# GitHub OAuth test configuration
spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email
